version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: qasim_inventory_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: qasim_inventory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - qasim_inventory_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qasim_inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: qasim_inventory_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/qasim_inventory
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production-please}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost
      DEBUG: "false"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    container_name: qasim_inventory_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  qasim_inventory_pgdata:
